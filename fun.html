<!DOCTYPE html>

      body {

        font-weight: 400;
        font-style: bold;
      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="main-styles2.css" />
    <link rel="stylesheet" href="tracks.css" />

      src="flames.gif"
